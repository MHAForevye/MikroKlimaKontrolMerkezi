# Cloudflare Workers: hem siteyi (statik dosyalar) hem /api/* kristal sunucusunu çalıştırır.
name = "mikroklimakontrolmerkezi"
main = "worker/index.js"
compatibility_date = "2025-11-01"

[assets]
directory = "."                     # siteyi bu klasörden sunar (gizlenecekler .assetsignore'da)
run_worker_first = ["/api/*", "/identity/*"]   # sadece /api/* ve /identity/* Worker'a gider, gerisi statik dosya

[[d1_databases]]
binding = "DB"
database_name = "mikroklima"
database_id = "a4576ecf-eead-4f1a-9cbf-ae0f6f79ccc6"   # npx wrangler d1 create mikroklima  çıktısındaki id

# Gizli değer (dosyaya yazma!):  npx wrangler secret put ADMIN_TOKEN

# Mağaza ayrı sitede (forevye-market reposu). Hesaplı uçlara sadece bu adres(ler) erişebilir; virgülle ayır, sadece alan adı, sonunda / yok.
# Panelden de verilebilir: Workers > mikroklimakontrolmerkezi > Settings > Variables.  Boşsa hesaplı uçlar kapalı kalır.
[vars]
EMAIL_FROM = "FOREVYE ID <SENIN-DOGRULANMIS-ADRESIN@gmail.com>"   # Brevo > Senders bölümünde doğrulanmış adres
MARKET_ORIGIN = "https://mhaforevye.github.io"
# Nexus Pass ve (kristal hesabı kullanan) diğer Forevye siteleri de MARKET_ORIGIN listesine eklenir (virgülle, sadece alan adı). Örnek:
#   MARKET_ORIGIN = "https://mhaforevye.github.io,https://KULLANICI.github.io"
# FOREVYE ID arayüzünün adresi (e-posta/parola kimliği): ID_ORIGIN = "https://KULLANICI.github.io"
# Google ile giriş: GOOGLE_CLIENT_ID = "....apps.googleusercontent.com" (herkese açık değer; Google Cloud → OAuth istemcisi, yetkili JavaScript kaynağı = ID sitesi)
# "FOREVYE ID ile giriş" yönlendirme adresleri (uygulama=tam adres, virgülle; başka adres kabul edilmez). Örnek:
#   ID_REDIRECTS = "sanal-banka=https://NEXUS.workers.dev/api/auth/id/callback,nexus-pass=https://KULLANICI.github.io/nexus-pass/"
# Ortak posta (ID + Nexus aynı Brevo hesabını buradan kullanır; Nexus /api/ext/mail ile ister) ve altın fiyatı aktarımı (/api/ext/gold) bu Worker'dadır.
# Gizli değerler (dosyaya yazma): wrangler secret put BREVO_API_KEY (ya da RESEND_API_KEY) | NEXUS_SECRET (= Nexus'taki GIFTCARD_API_SECRET) ; ayrıca [vars] EMAIL_FROM = "FOREVYE ID <no-reply@alanadin.com>"

# Zamanlayıcı uygulamasının adresi (isteğe bağlı, sadece alan adı; boşsa * ): ZP_ORIGIN = "https://KULLANICI.github.io"
# İmzalı jeton için: npx wrangler secret put ZP_SIGN_KEY   (ayrıntı: ZAMANLAYICI-BAGLANTI.md)
