# Cloudflare Workers: hem siteyi (statik dosyalar) hem /api/* kristal sunucusunu çalıştırır.
name = "mikroklimakontrolmerkezi"
main = "worker/index.js"
compatibility_date = "2025-11-01"

[assets]
directory = "."                     # siteyi bu klasörden sunar (gizlenecekler .assetsignore'da)
run_worker_first = ["/api/*"]       # sadece /api/* Worker'a gider, gerisi statik dosya

[[d1_databases]]
binding = "DB"
database_name = "mikroklima"
database_id = "a4576ecf-eead-4f1a-9cbf-ae0f6f79ccc6"   # npx wrangler d1 create mikroklima  çıktısındaki id

# Gizli değer (dosyaya yazma!):  npx wrangler secret put ADMIN_TOKEN

# Mağaza ayrı sitede (forevye-market reposu). Hesaplı uçlara sadece bu adres(ler) erişebilir; virgülle ayır, sadece alan adı, sonunda / yok.
# Panelden de verilebilir: Workers > mikroklimakontrolmerkezi > Settings > Variables.  Boşsa hesaplı uçlar kapalı kalır.
[vars]
MARKET_ORIGIN = "https://frovye.github.io"

# Zamanlayıcı uygulamasının adresi (isteğe bağlı, sadece alan adı; boşsa * ): ZP_ORIGIN = "https://KULLANICI.github.io"
# İmzalı jeton için: npx wrangler secret put ZP_SIGN_KEY   (ayrıntı: ZAMANLAYICI-BAGLANTI.md)
